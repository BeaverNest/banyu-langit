name: secret-guard

# Server-side counterpart to `.githooks/pre-commit`. The local hook has two holes
# this closes:
#   1. it only exists in clones that ran `.githooks/install.sh`
#   2. `git commit --no-verify` skips it entirely
# A required check on the remote cannot be skipped from a developer machine.
#
# History: `.env` was committed in 064b41d and stayed anonymously fetchable via
# raw.githubusercontent.com after it was deleted in a9757e0.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fatal: the commit(s) in THIS push must not add a secret-shaped path or line.
  pushed-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the range under test
        id: r
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          case "${base:-}" in
            0000000000000000000000000000000000000000|"") base="";;
          esac
          # a brand-new branch has no base: scan just the tip commit
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse "$head^" 2>/dev/null || echo '')"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "range under test: ${base:-<root>}..$head"

      - name: Reject secret-shaped paths added by this push
        run: |
          set -eu
          base='${{ steps.r.outputs.base }}'
          head='${{ steps.r.outputs.head }}'
          if [ -n "$base" ]; then span="$base..$head"; else span="$head"; fi
          bad=$(git log "$span" --name-only --diff-filter=A --pretty=format: \
                | sort -u | sed '/^$/d' \
                | grep -E '(^|/)(\.env($|\.[^/]*$)|env\.(local|production|development|test)$|\.npmrc|\.pypirc|\.netrc|id_rsa.*|id_ed25519.*|[^/]*\.(pem|key|p12|pfx))$' \
                | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Berkas berbentuk rahasia ditambahkan oleh push ini."
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "OK: push ini tidak menambahkan berkas rahasia."

      - name: Reject provider key patterns in this push's added lines
        run: |
          set -eu
          base='${{ steps.r.outputs.base }}'
          head='${{ steps.r.outputs.head }}'
          if [ -n "$base" ]; then span="$base..$head"; else span="$head"; fi
          added=$(git log "$span" -p --no-color --format= | grep -E '^\+' | grep -vE '^\+\+\+' || true)
          hits=$(printf '%s\n' "$added" \
            | grep -E 'ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{32,}|sk-ant-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{35}|(sk|rk)_live_[0-9A-Za-z]{20,}' \
            | grep -viE 'example|placeholder|your[_-]?key|xxx|REDACTED|dummy|sample|<[a-z_]+>' || true)
          av=$(printf '%s\n' "$added" \
            | grep -iE 'alpha[_-]?vantage[_-]?key[[:space:]]*[=:][[:space:]]*["'"'"']?[A-Z0-9]{12,}' \
            | grep -viE 'example|placeholder|your|xxx|REDACTED|=\s*$|\$\{|process\.env|os\.environ' || true)
          if [ -n "$hits$av" ]; then
            echo "::error::Baris baru memuat pola kunci rahasia (nilai disensor di bawah)."
            printf '%s\n%s\n' "$hits" "$av" | sed -E 's/(=|:)[[:space:]]*.{8,}$/\1 <nilai disembunyikan>/'
            exit 1
          fi
          echo "OK: tidak ada pola kunci pada baris yang ditambahkan."

  # Informational, never fails: legacy history is only reported. It stays red-by-
  # design until the history rewrite lands, so making it fatal would block every
  # unrelated push. See SECURITY.md for the rewrite procedure.
  legacy-history-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List secret-shaped paths anywhere in history (warning only)
        run: |
          set -eu
          found=$(git log --all --name-only --pretty=format: \
                  | sort -u | sed '/^$/d' \
                  | grep -E '(^|/)(\.env($|\.[^/]*$)|\.npmrc|\.pypirc|\.netrc|id_rsa.*|id_ed25519.*|[^/]*\.(pem|key|p12|pfx))$' \
                  | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$found" ]; then
            echo "::warning::Riwayat masih memuat berkas berbentuk rahasia (legacy, belum di-rewrite):"
            printf '%s\n' "$found"
            echo "Rotasi kunci di penyedianya lebih dulu, lalu git filter-repo (lihat SECURITY.md)."
          else
            echo "OK: riwayat bersih."
          fi
          exit 0
