services:
  banyu-langit:
    build: .
    container_name: banyu-langit
    ports:
      - "3003:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_OPTIONS=--max-old-space-size=4096
    volumes:
      - diary-uploads:/app/uploads
      - diary-data:/app/data
      - ./public:/app/public
      - ./server:/app/server
      - ./.env:/app/.env:ro
      # read-only git HEAD so the agent rail can stamp code_version (no git binary needed)
      - ./.git:/app/.git:ro
      - ./IDX-API-main/data:/app/IDX-API-main/data:ro
    restart: unless-stopped
    command: npx nodemon --watch server server/index.js

volumes:
  diary-uploads:
    external: true
    name: tradingdiary_diary-uploads
  diary-data:
    external: true
    name: tradingdiary_diary-data
